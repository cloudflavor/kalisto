name: Probe owned draft attachment access
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ${{ vars.KALISTO_LINUX_RUNNER }}
    container:
      image: ${{ vars.KALISTO_CI_IMAGE }}
    steps:
      - name: Compare repository-scoped download authentication
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.error, urllib.request
          server = os.environ['GITHUB_SERVER_URL'].rstrip('/')
          repository = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          class SameOrigin(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, response, code, message, headers, newurl):
                  parsed = urllib.parse.urlsplit(newurl)
                  if f'{parsed.scheme}://{parsed.netloc}' != server:
                      raise ValueError('Refusing cross-origin credential redirect')
                  return super().redirect_request(request, response, code, message, headers, newurl)
          opener = urllib.request.build_opener(SameOrigin())
          metadata_request = urllib.request.Request(
              f'{server}/api/v1/repos/{repository}/releases/146/assets/1143',
              headers={'Authorization': 'token '+token})
          with opener.open(metadata_request, timeout=30) as response:
              asset = json.load(response)
          successes = []
          for route, url in [('release', asset['browser_download_url']),
                             ('attachment', server+'/attachments/'+asset['uuid'])]:
              for method, authorization in [
                  ('token', 'token '+token),
                  ('bearer', 'Bearer '+token),
                  ('basic-actor', 'Basic '+base64.b64encode((os.environ['GITHUB_ACTOR']+':'+token).encode()).decode()),
                  ('basic-access', 'Basic '+base64.b64encode(('x-access-token:'+token).encode()).decode())]:
                  request = urllib.request.Request(url, headers={'Authorization': authorization})
                  try:
                      with opener.open(request, timeout=30) as response:
                          valid = response.status == 200 and response.read(2) == b'\x1f\x8b'
                          print(route, method, response.status, 'gzip' if valid else 'invalid', flush=True)
                          if valid: successes.append((route, method))
                  except urllib.error.HTTPError as error:
                      print(route, method, error.code, flush=True)
          assert successes, 'No automatic-token draft download route succeeded'
          PY
