name: Record Kalisto Firecracker showcase

on:
  workflow_dispatch:

concurrency:
  group: kalisto-showcase-firecracker
  cancel-in-progress: false

jobs:
  record:
    runs-on: tomis-host
    timeout-minutes: 90
    env:
      KALISTO_SHOWCASE_BACKEND: firecracker
      KALISTO_SHOWCASE_BUILD_ROOT: ${{ vars.KALISTO_LINUX_BUILD_ROOT }}
      KALISTO_FIRECRACKER_KERNEL: ${{ vars.KALISTO_FIRECRACKER_KERNEL }}
      KALISTO_FIRECRACKER_ROOTFS: ${{ vars.KALISTO_FIRECRACKER_ROOTFS }}
      KALISTO_LINUX_CA_BUNDLE: ${{ vars.KALISTO_LINUX_CA_BUNDLE }}
    steps:
      - name: Establish owned Linux workspace and exact dispatched source
        run: |
          set -eu
          umask 077
          storage=$(python3 - <<'PY'
          import os
          import stat
          import sys
          from pathlib import Path
          try:
              configured = os.environ.get("KALISTO_SHOWCASE_BUILD_ROOT")
              root = Path(configured) if configured else Path.home() / ".cache/kalisto-showcase-firecracker"
              assert root.is_absolute() and not root.is_symlink()
              root = root.resolve()
              assert root != Path("/") and root != Path.home().resolve()
              assert "\n" not in str(root) and "\r" not in str(root)
              root.mkdir(parents=True, exist_ok=True, mode=0o700)
              info = root.stat()
              assert info.st_uid == os.getuid() and not stat.S_IMODE(info.st_mode) & 0o077
              marker = root / ".showcase-storage-owner"
              if not marker.exists():
                  assert not any(root.iterdir()), "Unmarked storage must be empty"
                  marker.write_text(str(os.getuid()) + "\n")
              assert marker.read_text().strip() == str(os.getuid())
              print(root)
          except Exception:
              print("Linux showcase storage is unavailable or unsafe", file=sys.stderr)
              sys.exit(1)
          PY
          )
          workspace=$(mktemp -d "$storage/kalisto-showcase.XXXXXX")
          printf '%s\n' "$GITHUB_RUN_ID" > "$workspace/.showcase-owner"
          mkdir -p "$workspace/tmp" "$workspace/private" "$workspace/data/kalisto" \
            "$workspace/config" "$workspace/cache" "$workspace/bin" "$workspace/tools" \
            "$storage/cargo-home" "$storage/sccache" "$storage/showcase-target" \
            "$storage/firecracker-ci/artifacts"
          ln -s "$storage/firecracker-ci/artifacts" "$workspace/data/kalisto/artifacts"
          printf 'KALISTO_SHOWCASE_WORKSPACE=%s\nKALISTO_SHOWCASE_BUILD_ROOT=%s\n' "$workspace" "$storage" >> "$GITHUB_ENV"
          printf 'CARGO_HOME=%s/cargo-home\nSCCACHE_DIR=%s/sccache\n' "$storage" "$storage" >> "$GITHUB_ENV"
          printf 'CARGO_TARGET_DIR=%s/showcase-target\nTMPDIR=%s/tmp\n' "$storage" "$workspace" >> "$GITHUB_ENV"
          export TMPDIR="$workspace/tmp"
          cd "$workspace"
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          if [ -n "${KALISTO_LINUX_CA_BUNDLE:-}" ]; then
            test -r "$KALISTO_LINUX_CA_BUNDLE"
            export GIT_SSL_CAINFO="$KALISTO_LINUX_CA_BUNDLE"
          fi
          # Never persist or echo the job credential, even on a fetch failure.
          url="https://x-access-token:${GITHUB_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git"
          if ! git -c credential.helper= fetch -q --depth=1 "$url" "$GITHUB_SHA" 2>/dev/null; then
            echo 'Unable to fetch dispatched source' >&2
            exit 1
          fi
          unset url
          git checkout -q --detach "${GITHUB_SHA}^{commit}" 2>/dev/null
          echo 'Owned Linux workspace and exact source are ready.'
      - name: Select existing native tools and prepared boot artifacts
        run: |
          set -eu
          cd "$KALISTO_SHOWCASE_WORKSPACE"
          python3 - <<'PY'
          import os
          import platform
          import shutil
          import subprocess
          from pathlib import Path
          assert platform.system() == "Linux" and platform.machine() == "x86_64"
          assert os.access("/dev/kvm", os.R_OK | os.W_OK), "KVM must be accessible"
          subprocess.run(["unshare", "--user", "--map-root-user", "--net", "true"], check=True)
          work = Path(os.environ["KALISTO_SHOWCASE_WORKSPACE"])
          assert (work / ".showcase-owner").read_text().strip() == os.environ["GITHUB_RUN_ID"]
          tools = f"{Path.home()}/.local/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          firecracker = shutil.which("firecracker", path=tools)
          assert firecracker, "Existing Firecracker installation is required"
          version = subprocess.check_output([firecracker, "--version"], stderr=subprocess.DEVNULL, text=True)
          assert version.splitlines()[0] == "Firecracker v1.18.0", "Expected validated Firecracker v1.18.0"
          (work / "bin/firecracker").symlink_to(Path(firecracker).resolve(strict=True))
          for tool in ("debugfs", "mke2fs", "ssh", "ssh-keygen", "scp", "ip", "iptables", "sysctl",
                       "slirp4netns", "unshare", "nsenter", "curl", "nc", "jq"):
              assert shutil.which(tool, path=tools), f"Required native tool missing: {tool}"
          # Explicit vars win. Otherwise borrow only the known prepared user cache,
          # never artifacts from a product checkout or a live cluster's node disks.
          cache = Path.home() / ".local/share/kalisto/artifacts/firecracker-node"
          filenames = {"KALISTO_FIRECRACKER_KERNEL": "kalisto-vmlinux",
                       "KALISTO_FIRECRACKER_ROOTFS": "ubuntu-24.04-minimal-k3s-amd64-rootfs.raw"}
          with open(os.environ["GITHUB_ENV"], "a") as output:
              for key, filename in filenames.items():
                  value = os.environ.get(key)
                  if value:
                      image = Path(value)
                  else:
                      candidates = [cache / version / "x86_64" / filename for version in ("v1.18", "v1.13")]
                      image = next((p for p in candidates if p.is_file()), None)
                  assert image is not None and image.is_absolute(), f"Configure {key} with a prepared absolute image path"
                  image = image.resolve(strict=True)
                  assert image.is_file() and image.stat().st_size > 0 and os.access(image, os.R_OK)
                  assert "\n" not in str(image) and "\r" not in str(image)
                  output.write(f"{key}={image}\n")
          PY
          # Install solely in this run's private prefix; no system or user tool replacement.
          cargo install asciinema --version 3.2.1 --locked --root "$KALISTO_SHOWCASE_WORKSPACE/tools" \
            > "$KALISTO_SHOWCASE_WORKSPACE/private/asciinema-install.log" 2>&1
          ln -s "$KALISTO_SHOWCASE_WORKSPACE/tools/bin/asciinema" "$KALISTO_SHOWCASE_WORKSPACE/bin/asciinema"
      - name: Verify capture privacy and timing preservation
        run: |
          set -eu
          cd "$KALISTO_SHOWCASE_WORKSPACE"
          python3 -m unittest discover -s scripts/demos -p 'test_*.py' -v
      - name: Prepare outside recordings and capture four real Firecracker use cases
        run: |
          set -eu
          cd "$KALISTO_SHOWCASE_WORKSPACE"
          python3 scripts/demos/capture.py
      - name: Upload only sanitized successful publication inventory
        uses: https://data.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: kalisto-showcase-firecracker-${{ github.sha }}
          path: |
            ${{ env.KALISTO_SHOWCASE_WORKSPACE }}/public/start.cast
            ${{ env.KALISTO_SHOWCASE_WORKSPACE }}/public/deploy.cast
            ${{ env.KALISTO_SHOWCASE_WORKSPACE }}/public/resume.cast
            ${{ env.KALISTO_SHOWCASE_WORKSPACE }}/public/scale.cast
            ${{ env.KALISTO_SHOWCASE_WORKSPACE }}/public/app.yaml
            ${{ env.KALISTO_SHOWCASE_WORKSPACE }}/public/provenance.json
          if-no-files-found: error
          retention-days: 7
      - name: Clean only owned demo resources and retain failures privately
        if: always()
        env:
          SHOWCASE_JOB_STATUS: ${{ job.status }}
        run: |
          set -eu
          if [ -z "${KALISTO_SHOWCASE_WORKSPACE:-}" ]; then exit 0; fi
          cd "$KALISTO_SHOWCASE_WORKSPACE"
          if [ -f scripts/demos/capture.py ]; then
            python3 scripts/demos/capture.py cleanup
          fi
          python3 - <<'PY'
          import os
          import shutil
          import sys
          from pathlib import Path
          try:
              work = Path(os.environ["KALISTO_SHOWCASE_WORKSPACE"]).resolve(strict=True)
              root = Path(os.environ["KALISTO_SHOWCASE_BUILD_ROOT"]).resolve(strict=True)
              assert work.parent == root and work.name.startswith("kalisto-showcase.")
              assert (work / ".showcase-owner").read_text().strip() == os.environ["GITHUB_RUN_ID"]
              if os.environ["SHOWCASE_JOB_STATUS"] == "success" and (work / "private/publishable").is_file():
                  shutil.rmtree(work)
                  print("Owned demo workspace removed; shared artifacts and other workloads preserved.")
              else:
                  print("Failed capture evidence retained privately; nothing raw was uploaded.")
          except Exception:
              print("Owned workspace cleanup requires private runner inspection", file=sys.stderr)
              sys.exit(1)
          PY
