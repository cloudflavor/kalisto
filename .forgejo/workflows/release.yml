name: Release binaries

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: Optional SemVer tag for manual candidate packages; never publishes
        required: false
        default: ''
        type: string

env:
  KALISTO_BUILD_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_tag != '' && format('refs/tags/{0}', inputs.candidate_tag) || github.ref }}

# Never cancel a release halfway through publication. Different tags are isolated.
concurrency:
  group: kalisto-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ${{ vars.KALISTO_LINUX_RUNNER }}
    timeout-minutes: 45
    container:
      image: ${{ vars.KALISTO_CI_IMAGE }}
      options: ${{ vars.KALISTO_CI_CONTAINER_OPTIONS }}
    env:
      CARGO_TARGET_DIR: /tmp/kalisto-release-validation
    steps:
      - name: Checkout exact source and release tag
        run: |
          set -eu
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          url="https://x-access-token:${GITHUB_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 "$url" "$GITHUB_SHA"
          case "$GITHUB_REF" in refs/tags/*) git fetch -q --depth=1 "$url" "$GITHUB_REF:$GITHUB_REF" ;; esac
          git checkout -q --detach "${GITHUB_SHA}^{commit}"
      - name: Validate release tooling and tag policy
        run: |
          python3 -m unittest discover -s scripts/release -p 'test_*.py' -v
          python3 scripts/release/release.py identity --ref "$KALISTO_BUILD_REF" --commit "$(git rev-parse HEAD)" --run-id "$GITHUB_RUN_ID"
      - name: Require tagged source on reviewed main
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -eu
          url="https://x-access-token:${GITHUB_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git"
          git fetch -q --unshallow "$url" refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$(git rev-parse HEAD)" refs/remotes/origin/main
          test "$(git rev-parse "${GITHUB_REF}^{commit}")" = "$(git rev-parse HEAD)"
      - name: Rust checks
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked -- --test-threads=1

  linux:
    needs: validate
    runs-on: ${{ vars.KALISTO_LINUX_RUNNER }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    container:
      image: ${{ vars.KALISTO_CI_IMAGE }}
      options: ${{ vars.KALISTO_CI_CONTAINER_OPTIONS }}
    env:
      CARGO_TARGET_DIR: /tmp/kalisto-release-target
      KALISTO_RELEASE_DIST: /tmp/kalisto-release-dist
    steps:
      - name: Checkout exact source and release tag
        run: |
          set -eu
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          url="https://x-access-token:${GITHUB_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 "$url" "$GITHUB_SHA"
          case "$GITHUB_REF" in refs/tags/*) git fetch -q --depth=1 "$url" "$GITHUB_REF:$GITHUB_REF" ;; esac
          git checkout -q --detach "${GITHUB_SHA}^{commit}"
      - name: Install user-mode ARM64 smoke runner
        if: ${{ matrix.target == 'aarch64-unknown-linux-musl' }}
        run: |
          set -eu
          if ! command -v qemu-aarch64 >/dev/null; then
            if [ "$(id -u)" = 0 ]; then
              apt-get update -o Acquire::Retries=3
              apt-get install -y --no-install-recommends qemu-user
            else
              sudo -n apt-get update -o Acquire::Retries=3
              sudo -n apt-get install -y --no-install-recommends qemu-user
            fi
          fi
      - name: Build static binary, verify architecture and smoke
        run: bash scripts/release/build.sh '${{ matrix.target }}'
      - name: Upload candidate archive
        # Forgejo-compatible artifact v3; full verified commit pins.
        uses: https://data.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: kalisto-${{ matrix.target }}
          path: /tmp/kalisto-release-dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  macos:
    needs: validate
    # Never execute fork code on a shared native host.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ vars.KALISTO_MACOS_RUNNER }}
    timeout-minutes: 60
    env:
      KALISTO_MACOS_VOLUME: ${{ vars.KALISTO_MACOS_VOLUME }}
      KALISTO_MACOS_BUILD_ROOT: ${{ vars.KALISTO_MACOS_BUILD_ROOT }}
    steps:
      - name: Verify mounted external storage and checkout into owned workspace
        run: |
          set -eu
          storage=$(python3 - <<'PY'
          import os
          from pathlib import Path
          assert Path(os.environ["KALISTO_MACOS_VOLUME"]).is_absolute(), "external volume must be an absolute path"
          assert Path(os.environ["KALISTO_MACOS_BUILD_ROOT"]).is_absolute(), "build root must be an absolute path"
          volume = Path(os.environ["KALISTO_MACOS_VOLUME"]).resolve(strict=True)
          root = Path(os.environ["KALISTO_MACOS_BUILD_ROOT"]).resolve()
          assert volume != Path("/") and os.path.ismount(volume), "external build volume must be mounted"
          assert root != volume and root.is_relative_to(volume), "build root must be beneath the external volume"
          root.mkdir(parents=True, exist_ok=True)
          assert root.stat().st_dev == volume.stat().st_dev, "build root must remain on the external volume"
          print(root)
          PY
          )
          workspace=$(mktemp -d "$storage/kalisto-release.XXXXXX")
          printf 'KALISTO_RELEASE_WORKSPACE=%s\nKALISTO_RELEASE_DIST=%s/dist\n' "$workspace" "$workspace" >> "$GITHUB_ENV"
          mkdir -p "$workspace/tmp"
          export TMPDIR="$workspace/tmp"
          printf 'CARGO_HOME=%s/cargo-home\nRUSTUP_HOME=%s/release-rustup\nSCCACHE_DIR=%s/sccache\n' "$storage" "$storage" "$storage" >> "$GITHUB_ENV"
          printf 'CARGO_TARGET_DIR=%s/release-target/aarch64-apple-darwin\nTMPDIR=%s/tmp\n' "$storage" "$workspace" >> "$GITHUB_ENV"
          cd "$workspace"
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          url="https://x-access-token:${GITHUB_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 "$url" "$GITHUB_SHA"
          case "$GITHUB_REF" in refs/tags/*) git fetch -q --depth=1 "$url" "$GITHUB_REF:$GITHUB_REF" ;; esac
          git checkout -q --detach "${GITHUB_SHA}^{commit}"
      - name: Build binary, verify architecture and native smoke where supported
        run: cd "$KALISTO_RELEASE_WORKSPACE" && bash scripts/release/build.sh aarch64-apple-darwin
      - name: Upload candidate archive
        uses: https://data.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: kalisto-aarch64-apple-darwin
          path: ${{ env.KALISTO_RELEASE_DIST }}/*.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Remove only this job's owned workspace
        if: always()
        run: |
          if [ -n "${KALISTO_RELEASE_WORKSPACE:-}" ]; then
            storage=$(cd "$KALISTO_MACOS_BUILD_ROOT" && pwd -P)
            case "$KALISTO_RELEASE_WORKSPACE" in
              "$storage"/kalisto-release.*) rm -rf -- "$KALISTO_RELEASE_WORKSPACE" ;;
              *) echo 'Refusing cleanup outside owned external workspace' >&2; exit 1 ;;
            esac
          fi

  publish:
    needs: [validate, linux, macos]
    runs-on: ${{ vars.KALISTO_LINUX_RUNNER }}
    timeout-minutes: 20
    container:
      image: ${{ vars.KALISTO_CI_IMAGE }}
    steps:
      - name: Checkout exact source, tag and reviewed main ancestry
        run: |
          set -eu
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          url="https://x-access-token:${GITHUB_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git"
          git fetch -q "$url" "$GITHUB_SHA" refs/heads/main:refs/remotes/origin/main
          case "$GITHUB_REF" in refs/tags/*) git fetch -q "$url" "$GITHUB_REF:$GITHUB_REF" ;; esac
          git checkout -q --detach "${GITHUB_SHA}^{commit}"
      - name: Download all three candidates
        uses: https://data.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with:
          path: /tmp/kalisto-release-candidates
      - name: Verify complete candidate inventory without publishing on PR/manual runs
        run: |
          tag=$(python3 scripts/release/release.py identity --ref "$KALISTO_BUILD_REF" --commit "$(git rev-parse HEAD)" --run-id "$GITHUB_RUN_ID" | awk -F= '/^BUILD_TAG=/ {print $2}')
          python3 scripts/release/release.py verify --root /tmp/kalisto-release-candidates --tag "$tag" --commit "$(git rev-parse HEAD)"
      - name: Synchronize reviewed source and verify GitHub draft assets before publication
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        env:
          KALISTO_GITHUB_TOKEN: ${{ secrets.KALISTO_GITHUB_TOKEN }}
          KALISTO_GITHUB_REPOSITORY: ${{ vars.KALISTO_GITHUB_REPOSITORY }}
        run: |
          python3 scripts/release/release.py publish --root /tmp/kalisto-release-candidates \
            --tag "${GITHUB_REF#refs/tags/}" --commit "$(git rev-parse HEAD)"
