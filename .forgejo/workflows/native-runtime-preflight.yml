name: Read-only native runtime preflight (not acceptance)

on:
  workflow_dispatch:
    inputs:
      budget_case:
        description: Existing native CI evidence directory (budget-PID-TIMESTAMP)
        required: true
        type: string

jobs:
  preflight:
    runs-on: ${{ vars.KALISTO_MACOS_RUNNER }}
    timeout-minutes: 5
    env:
      KALISTO_MACOS_VOLUME: ${{ vars.KALISTO_MACOS_VOLUME }}
      KALISTO_MACOS_BUILD_ROOT: ${{ vars.KALISTO_MACOS_BUILD_ROOT }}
      BUDGET_CASE: ${{ inputs.budget_case }}
    steps:
      - name: Inventory existing runtime without starting services
        run: |
          set -eu
          python3 -B - <<'PY'
          import collections
          import json
          import os
          from pathlib import Path
          import re
          import stat
          import subprocess
          import sys

          # Command/schema evidence, pinned to the installed release:
          # https://github.com/apple/container/blob/1.7.1/Sources/ContainerCommands/Container/ContainerList.swift
          # https://github.com/apple/container/blob/1.7.1/Sources/ContainerResource/Container/ManagedContainer.swift
          # https://github.com/apple/container/blob/1.7.1/Sources/ContainerResource/Container/ContainerStatus.swift
          # Ordinary list --all --format json excludes BOTH machine and cluster resources.
          # Do not invoke cluster/machine commands: XPC can demand-launch a plugin.
          # https://github.com/apple/container/blob/0.10.0/Sources/ContainerCommands/Image/ImageList.swift
          # Old image list --format json emits [{reference, fullSize, descriptor}].
          # Both image-list versions omit infrastructure images; zero is NOT an empty-store proof.
          facts = {"preflight_only": True, "host_changes_authorized_by_this_job": False}
          blocked = []

          class InspectionBlocked(Exception):
              pass

          def require(condition, reason):
              if not condition:
                  raise InspectionBlocked(reason)

          def run(argv, env=None):
              result = subprocess.run(argv, env=env, stdin=subprocess.DEVNULL,
                                      capture_output=True, text=True, timeout=20)
              # Never include subprocess output/errors in exceptions or logs: they can
              # contain container/image names, environment values or credentials.
              require(result.returncode == 0, "read-only command failed")
              return result.stdout

          def absolute(value):
              require(isinstance(value, str), "invalid captured path")
              path = Path(value)
              require(path.is_absolute() and path != Path("/") and ".." not in path.parts,
                      "invalid captured path")
              return path

          def environment(service):
              # No inherited CONTAINER_* settings, registry tokens or configuration overrides.
              result = {key: os.environ[key] for key in ("HOME", "USER", "LOGNAME", "PATH")
                        if key in os.environ}
              result.update({key: service[key] for key in
                             ("CONTAINER_APP_ROOT", "CONTAINER_INSTALL_ROOT", "TMPDIR")
                             if key in service})
              require(all(isinstance(value, str) for value in result.values()),
                      "invalid captured service environment")
              return result

          def field(text, key, separator="="):
              program_rows = list(re.finditer(r"^([ \t]*)program[ \t]*=[ \t]*(.*?)[ \t]*$",
                                              text, re.MULTILINE))
              require(bool(program_rows), "launchd program field is absent")
              root_depth = min(len(row[1].expandtabs()) for row in program_rows)
              if separator == "=>":
                  headers = [row for row in re.finditer(
                      r"^([ \t]*)environment[ \t]*=[ \t]*\{[ \t]*$", text, re.MULTILINE)
                      if len(row[1].expandtabs()) == root_depth]
                  require(len(headers) == 1, "unknown explicit launchd environment schema")
                  header = headers[0]
                  closing = re.search(r"^" + re.escape(header[1]) + r"\}[ \t]*$",
                                      text[header.end():], re.MULTILINE)
                  require(closing is not None, "unterminated launchd environment")
                  text = text[header.end():header.end() + closing.start()]
              rows = list(re.finditer(r"^([ \t]*)" + re.escape(key) + r"[ \t]*"
                                     + re.escape(separator) + r"[ \t]*(.*?)[ \t]*$",
                                     text, re.MULTILINE))
              if separator == "=":
                  rows = [row for row in rows if len(row[1].expandtabs()) == root_depth]
              require(len(rows) == 1, "unknown launchd field schema: " + key)
              return rows[0][2]

          def service_live(label, captured):
              text = run(["/bin/launchctl", "print", domain + "/" + label])
              require(field(text, "program") == captured["program"], "service executable changed")
              for key in ("CONTAINER_APP_ROOT", "CONTAINER_INSTALL_ROOT", "TMPDIR"):
                  if key in captured:
                      require(field(text, key, "=>") == captured[key], "service environment changed")
              require(field(text, "state") == "running", "service is not already running")
              pid = field(text, "pid")
              runs = field(text, "runs")
              require(pid.isdecimal() and int(pid) > 0 and runs.isdecimal(),
                      "unknown live service identity")
              return (int(pid), int(runs))

          def executable(service, relative):
              root = absolute(service["CONTAINER_INSTALL_ROOT"]).resolve(strict=True)
              path = absolute(service["CONTAINER_INSTALL_ROOT"]) / relative
              require(path.is_file() and os.access(path, os.X_OK), "matching native binary absent")
              resolved = path.resolve(strict=True)
              require(resolved.is_relative_to(root), "native binary escapes captured installation")
              return resolved

          def version(path, env, app):
              text = run([str(path), "--version"], env)
              match = re.fullmatch(re.escape(app) + r"(?: CLI)? version ([0-9]+\.[0-9]+\.[0-9]+) \(build: [^\n]+\)\s*", text)
              require(match is not None, "unknown native binary version schema")
              return match[1]

          def workload_sample():
              labels = run(["/bin/launchctl", "list"]).splitlines()
              require(labels and labels[0].split() == ["PID", "Status", "Label"],
                      "unknown launchd list schema")
              counts = collections.Counter()
              for line in labels[1:]:
                  columns = line.split()
                  require(len(columns) == 3 and (columns[0] == "-" or columns[0].isdecimal())
                          and re.fullmatch(r"-?[0-9]+", columns[1]), "unknown launchd row schema")
                  label = columns[2].lower()
                  if "container" not in label:
                      continue
                  if "cluster" in label or "machine" in label:
                      counts["cluster_machine_labels"] += 1
                  if "runtime" in label and columns[0] != "-":
                      counts["live_runtime_labels"] += 1
              # comm is the executable path ONLY; never request args/command/environment.
              processes = run(["/bin/ps", "-axww", "-o", "pid=,ppid=,uid=,comm="]).splitlines()
              require(bool(processes), "empty process inventory")
              for line in processes:
                  columns = line.strip().split(None, 3)
                  require(len(columns) == 4 and all(part.isdecimal() for part in columns[:3]),
                          "unknown process inventory schema")
                  pid = int(columns[0])
                  if pid == os.getpid():
                      continue
                  name = Path(columns[3]).name.lower()
                  if (name in {"container-runtime-linux", "container-core-clusters", "machine-apiserver",
                               "virtualmachine", "com.apple.virtualization.virtualmachine", "vfkit", "krunkit"}
                          or name.startswith("qemu-system-")):
                      counts["vm_runtime_processes"] += 1
                  if (name in {"container", "kalisto"} or name.startswith("kalisto-")
                          or name.startswith("macos_three_node_boot_budget")
                          or name.startswith("macos_apple_container")):
                      counts["concurrent_container_kalisto_processes"] += 1
              return {key: counts[key] for key in ("cluster_machine_labels", "live_runtime_labels",
                      "vm_runtime_processes", "concurrent_container_kalisto_processes")}

          def metadata(relative):
              # Fixed paths only, metadata only, no following symlinks or reading files.
              path = app_root
              for part in Path(relative).parts:
                  path = path / part
                  require(not path.is_symlink(), "runtime metadata path is a symlink")
                  if not path.exists():
                      return {"present": False}
                  require(path.resolve(strict=True).is_relative_to(app_root), "runtime metadata escaped appRoot")
              info = path.lstat()
              require(info.st_uid == os.getuid(), "runtime metadata has unexpected owner")
              if stat.S_ISDIR(info.st_mode):
                  counts = collections.Counter()
                  for entry in path.iterdir():
                      mode = entry.lstat().st_mode
                      counts["directories" if stat.S_ISDIR(mode) else "files" if stat.S_ISREG(mode)
                             else "symlinks" if stat.S_ISLNK(mode) else "other"] += 1
                  return {"present": True, "kind": "directory", "entry_counts": dict(counts),
                          "permissions": stat.S_IMODE(info.st_mode)}
              require(stat.S_ISREG(info.st_mode), "unknown runtime metadata kind")
              return {"present": True, "kind": "file", "bytes": info.st_size,
                      "permissions": stat.S_IMODE(info.st_mode)}

          try:
              volume = Path(os.environ["KALISTO_MACOS_VOLUME"]).resolve(strict=True)
              base = Path(os.environ["KALISTO_MACOS_BUILD_ROOT"]).resolve(strict=True)
              require(volume != Path("/") and os.path.ismount(volume), "external build volume must be mounted")
              require(base != volume and base.is_relative_to(volume)
                      and base.stat().st_dev == volume.stat().st_dev, "unsafe external build root")
              case = os.environ["BUDGET_CASE"]
              require(re.fullmatch(r"budget-[0-9]+-[0-9]+", case), "not a native CI evidence directory")
              evidence = base / "apple-container-ci/target/kalisto/boot-budget" / case
              identity_path = evidence / "runtime-before-pull.json"
              require(not evidence.is_symlink() and not identity_path.is_symlink(), "symlinked evidence")
              resolved = identity_path.resolve(strict=True)
              require(resolved.parent == evidence.resolve(strict=True) and resolved.is_relative_to(base)
                      and resolved.is_file() and resolved.stat().st_uid == os.getuid(), "unowned evidence")
              identity = json.loads(resolved.read_text())
              services = identity["services"]
              api_label = "com.apple.container.apiserver"
              image_label = "com.apple.container.container-core-images"
              api = services[api_label]
              helper = services[image_label]
              app_root = absolute(identity["paths"]["appRoot"])
              require(not app_root.is_symlink(), "symlinked captured appRoot")
              app_root = app_root.resolve(strict=True)
              require(app_root.is_dir() and app_root.stat().st_uid == os.getuid(), "unowned captured appRoot")
              for service in (api, helper):
                  require(absolute(service["CONTAINER_APP_ROOT"]).resolve(strict=True) == app_root,
                          "captured services use different application roots")
                  root = absolute(service["CONTAINER_INSTALL_ROOT"]).resolve(strict=True)
                  program = absolute(service["program"]).resolve(strict=True)
                  require(program.is_relative_to(root), "service program escapes captured installation")
              session = run(["/bin/launchctl", "managername"]).strip()
              require(session in ("Aqua", "Background"), "unsupported launchd session")
              domain = ("gui" if session == "Aqua" else "user") + "/" + str(os.getuid())
              api_env = environment(api)
              helper_env = environment(helper)
              api_program = absolute(api["program"])
              require(api_program.name == "container-apiserver", "unexpected captured API program")
              cli = executable(api, str(api_program.parent.relative_to(absolute(api["CONTAINER_INSTALL_ROOT"])) / "container"))
              require(cli == absolute(identity["executable"]).resolve(strict=True), "captured native CLI changed")
              api_before = service_live(api_label, api)
              facts["native_cli_version"] = version(cli, api_env, "container")
              require(facts["native_cli_version"] == "1.7.1" and identity["server"]["version"] == "1.7.1",
                      "preflight requires captured supported 1.7.1 API/CLI")
              facts["api_identity_matches_capture"] = (str(api_before[0]) == api.get("pid")
                                                       and str(api_before[1]) == api.get("runs"))
              require(facts["api_identity_matches_capture"], "API restarted since evidence capture")
              before = workload_sample()
              facts["workloads_before"] = before
              if any(before.values()):
                  blocked.append("active-or-uninspectable-cluster-vm-or-concurrent-operation")
              # Check live registration immediately before XPC. Never call system start,
              # cluster list, machine list, or a helper's start subcommand.
              require(service_live(api_label, api) == api_before, "API changed before ordinary inventory")
              ordinary = json.loads(run([str(cli), "list", "--all", "--format", "json"], api_env))
              require(isinstance(ordinary, list), "unknown ordinary container list schema")
              states = collections.Counter()
              for item in ordinary:
                  require(isinstance(item, dict) and isinstance(item.get("id"), str)
                          and isinstance(item.get("configuration"), dict)
                          and isinstance(item.get("status"), dict), "unknown ordinary container entry schema")
                  state = item["status"].get("state")
                  require(state in ("unknown", "stopped", "running", "stopping"), "unknown container state schema")
                  states[state] += 1
              facts["ordinary_containers_all_states"] = {"count": len(ordinary), "states": dict(states)}
              if states["running"] or states["stopping"] or states["unknown"]:
                  blocked.append("ordinary-containers-active-or-unknown")
              facts["cluster_machine_cli_invoked"] = False
              facts["concurrent_operation_detection"] = "executable-names-only-no-command-arguments"
              facts["runtime_metadata"] = {relative: metadata(relative) for relative in (
                  "state.json", "content", "content/blobs", "content/blobs/sha256", "content/ingest",
                  "snapshots", "snapshots/ingest", "plugin-state/container-core-clusters",
                  "plugin-state/machine-apiserver")}
              # Both upstream layouts use state.json and these ingest directories.
              # File size is metadata, NOT a claim about the JSON/store format.
              facts["store_format_from_metadata"] = "unknown-no-store-contents-read"
              for relative in ("content/ingest", "snapshots/ingest"):
                  inventory = facts["runtime_metadata"][relative]
                  if inventory["present"]:
                      require(inventory["kind"] == "directory", "unknown ingest metadata kind")
                      if sum(inventory["entry_counts"].values()):
                          blocked.append("image-or-snapshot-ingest-entries-in-flight-or-interrupted")
              for relative in ("plugin-state/container-core-clusters", "plugin-state/machine-apiserver"):
                  if facts["runtime_metadata"][relative]["present"]:
                      blocked.append("cluster-machine-persistent-state-not-inspected")
              # The existing old helper is never replaced or queried with the new CLI.
              helper_before = service_live(image_label, helper)
              helper_program = absolute(helper["program"])
              require(helper_program.name == "container-core-images", "unexpected image helper program")
              helper_version = version(helper_program, helper_env, "container-core-images")
              facts["image_helper_version"] = helper_version
              # Only native CLI candidates inside the helper's CAPTURED installation.
              image_cli = None
              for relative in ("bin/container", "cli/container"):
                  root = absolute(helper["CONTAINER_INSTALL_ROOT"])
                  if (root / relative).is_file():
                      candidate = executable(helper, relative)
                      if version(candidate, helper_env, "container") == helper_version:
                          image_cli = candidate
                          break
              require(image_cli is not None, "already-present matching image CLI absent")
              facts["image_cli_version"] = helper_version
              # This schema is explicitly supported below; no speculative command fallback.
              require(helper_version == "0.10.0", "unreviewed image inventory CLI schema")
              require(service_live(image_label, helper) == helper_before, "helper changed before inventory")
              images = json.loads(run([str(image_cli), "image", "list", "--format", "json"], helper_env))
              require(isinstance(images, list), "unknown image list schema")
              media_types = collections.Counter()
              for image in images:
                  require(isinstance(image, dict) and isinstance(image.get("reference"), str)
                          and isinstance(image.get("fullSize"), str)
                          and isinstance(image.get("descriptor"), dict), "unknown image entry schema")
                  media_type = image["descriptor"].get("mediaType")
                  require(media_type in ("application/vnd.oci.image.index.v1+json",
                          "application/vnd.oci.image.manifest.v1+json",
                          "application/vnd.docker.distribution.manifest.list.v2+json",
                          "application/vnd.docker.distribution.manifest.v2+json"), "unknown image media type")
                  media_types[media_type] += 1
              facts["user_image_inventory"] = {"count": len(images), "descriptor_media_types": dict(media_types),
                                                "includes_infrastructure_images": False}
              # Cross-major upgrade safety is proven only for a truly empty store.
              # User-image listing omits infrastructure images, so inspect all fixed
              # content/snapshot namespaces as well as the reference-state file.
              state = facts["runtime_metadata"]["state.json"]
              reference_count = 0
              if state["present"]:
                  require(state["kind"] == "file" and state["bytes"] <= 16 * 1024 * 1024,
                          "unknown or oversized image reference state")
                  descriptor = os.open(app_root / "state.json", os.O_RDONLY | os.O_NOFOLLOW)
                  with os.fdopen(descriptor, "rb") as stream:
                      info = os.fstat(stream.fileno())
                      require(stat.S_ISREG(info.st_mode) and info.st_uid == os.getuid(),
                              "unowned image reference state")
                      raw_state = stream.read(16 * 1024 * 1024 + 1)
                  require(len(raw_state) <= 16 * 1024 * 1024, "oversized image reference state")
                  references = json.loads(raw_state)
                  require(isinstance(references, dict), "unknown image reference state schema")
                  reference_count = len(references)
              facts["image_reference_count"] = reference_count
              empty = {
                  "reference_state_empty": reference_count == 0,
                  "user_image_inventory_empty": len(images) == 0,
              }
              for relative in ("content/blobs/sha256", "content/ingest", "snapshots/ingest"):
                  inventory = facts["runtime_metadata"][relative]
                  require(not inventory["present"] or inventory["kind"] == "directory",
                          "unknown image-store namespace kind")
                  empty[relative + "_empty"] = (not inventory["present"] or
                                               sum(inventory["entry_counts"].values()) == 0)
              for relative, allowed in (("content", {"blobs", "ingest"}),
                                        ("content/blobs", {"sha256"}),
                                        ("snapshots", {"ingest"})):
                  inventory = facts["runtime_metadata"][relative]
                  require(not inventory["present"] or inventory["kind"] == "directory",
                          "unknown image-store root kind")
                  empty[relative + "_only_expected_empty_directories"] = (
                      not inventory["present"] or all(
                          entry.name in allowed and not entry.is_symlink() and entry.is_dir()
                          for entry in (app_root / relative).iterdir()))
              facts["empty_store_proof"] = empty
              if all(empty.values()):
                  facts["image_store_migration_assessment"] = "EMPTY-no-retained-image-metadata-to-migrate"
              else:
                  facts["image_store_migration_assessment"] = "BLOCKED-retained-cross-major-image-store"
                  blocked.append("retained-or-unproven-cross-major-image-store")
              require(service_live(api_label, api) == api_before, "API changed during preflight")
              require(service_live(image_label, helper) == helper_before, "helper changed during preflight")
              after = workload_sample()
              facts["workloads_after"] = after
              if any(after.values()) or after != before:
                  blocked.append("workload-state-active-unknown-or-changed")
          except Exception as error:
              # Exception messages from JSON/OS/subprocess can contain private content.
              # Only our fixed validation reasons are safe to disclose.
              facts["inspection_failure_type"] = type(error).__name__
              if isinstance(error, InspectionBlocked):
                  facts["inspection_failure_reason"] = str(error)
              blocked.append("incomplete-or-unknown-preflight-state")
          facts["decision"] = "BLOCKED" if blocked else "NO_BLOCKERS_OBSERVED_NOT_AUTHORIZATION"
          facts["blockers"] = sorted(set(blocked))
          print(json.dumps(facts, indent=2, sort_keys=True))
          sys.exit(1 if blocked else 0)
          PY
