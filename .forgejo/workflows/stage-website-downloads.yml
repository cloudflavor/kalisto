name: Stage verified website downloads

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published Kalisto SemVer tag
        required: true
        type: string

concurrency:
  group: kalisto-website-downloads
  cancel-in-progress: false

jobs:
  stage:
    runs-on: tomis-host
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      KALISTO_LINUX_CA_BUNDLE: ${{ vars.KALISTO_LINUX_CA_BUNDLE }}
    steps:
      - name: Check out exact workflow source
        run: |
          set -eu
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          if [ -n "${KALISTO_LINUX_CA_BUNDLE:-}" ]; then
            export GIT_SSL_CAINFO="$KALISTO_LINUX_CA_BUNDLE"
          fi
          url="https://x-access-token:${GITHUB_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git"
          git -c credential.helper= fetch -q --depth=1 "$url" "$GITHUB_SHA" 2>/dev/null
          unset url
          git checkout -q --detach "${GITHUB_SHA}^{commit}"
      - name: Stage published assets without replacing existing downloads
        env:
          GITHUB_TOKEN: ${{ secrets.KALISTO_RELEASE_TOKEN }}
        run: |
          set -eu
          if [ -n "${KALISTO_LINUX_CA_BUNDLE:-}" ]; then
            export SSL_CERT_FILE="$KALISTO_LINUX_CA_BUNDLE"
          fi
          python3 scripts/release/stage.py \
            --tag "$RELEASE_TAG" \
            --root "$HOME/.local/share/cloudflavor/distributions/kalisto/$RELEASE_TAG"
