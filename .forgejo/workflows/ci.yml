name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: kalisto-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/feat/apple-container-k3s' && github.event_name != 'workflow_dispatch' }}

jobs:
  rust-fmt:
    runs-on: ${{ vars.KALISTO_LINUX_RUNNER }}
    timeout-minutes: 60
    container:
      image: ${{ vars.KALISTO_CI_IMAGE }}
      options: ${{ vars.KALISTO_CI_CONTAINER_OPTIONS }}
    env:
      CARGO_TARGET_DIR: /tmp/kalisto-target-fmt
    steps:
      - name: Checkout exact revision
        run: |
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          # Keep the job token out of the persisted remote URL.
          url="https://x-access-token:${GITHUB_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3 4 5 6; do
            if git fetch -q --depth=1 "$url" "${GITHUB_SHA}"; then break; fi
            if [ "$attempt" = 6 ]; then echo "Could not fetch repository" >&2; exit 1; fi
            sleep 10
          done
          git checkout -q FETCH_HEAD
      - name: Toolchain versions
        run: |
          rustc --version
          cargo --version
      - name: Format
        run: cargo fmt --all --check
      - name: Check terminal harness formatting
        run: |
          python3 scripts/ci/progress_manifest.py /tmp/kalisto-progress-fmt
          cargo fmt --manifest-path /tmp/kalisto-progress-fmt/Cargo.toml --all --check

  rust-clippy:
    runs-on: ${{ vars.KALISTO_LINUX_RUNNER }}
    timeout-minutes: 60
    container:
      image: ${{ vars.KALISTO_CI_IMAGE }}
      options: ${{ vars.KALISTO_CI_CONTAINER_OPTIONS }}
    env:
      CARGO_TARGET_DIR: /tmp/kalisto-target-clippy
    steps:
      - name: Checkout exact revision
        run: |
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          url="https://x-access-token:${GITHUB_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3 4 5 6; do
            if git fetch -q --depth=1 "$url" "${GITHUB_SHA}"; then break; fi
            if [ "$attempt" = 6 ]; then echo "Could not fetch repository" >&2; exit 1; fi
            sleep 10
          done
          git checkout -q FETCH_HEAD
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Compile cache stats
        if: always()
        run: sccache --show-stats
      - name: Upload resolved dependency lock
        if: always()
        uses: https://data.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: resolved-dependencies
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 7

  rust-test:
    runs-on: ${{ vars.KALISTO_LINUX_RUNNER }}
    timeout-minutes: 60
    container:
      image: ${{ vars.KALISTO_CI_IMAGE }}
      options: ${{ vars.KALISTO_CI_CONTAINER_OPTIONS }}
    env:
      CARGO_TARGET_DIR: /tmp/kalisto-target-test
    steps:
      - name: Checkout exact revision
        run: |
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          url="https://x-access-token:${GITHUB_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3 4 5 6; do
            if git fetch -q --depth=1 "$url" "${GITHUB_SHA}"; then break; fi
            if [ "$attempt" = 6 ]; then echo "Could not fetch repository" >&2; exit 1; fi
            sleep 10
          done
          git checkout -q FETCH_HEAD
      - name: Test
        run: cargo test -- --test-threads=1
      - name: Test native terminal progress and plain output
        run: |
          python3 scripts/ci/progress_manifest.py /tmp/kalisto-progress-test
          cargo test --manifest-path /tmp/kalisto-progress-test/Cargo.toml \
            --test terminal-progress -- --nocapture --test-threads=1

  build-bin:
    runs-on: ${{ vars.KALISTO_LINUX_RUNNER }}
    timeout-minutes: 60
    container:
      image: ${{ vars.KALISTO_CI_IMAGE }}
      options: ${{ vars.KALISTO_CI_CONTAINER_OPTIONS }}
    env:
      CARGO_TARGET_DIR: /tmp/kalisto-target-build
    needs: [rust-fmt, rust-clippy, rust-test]
    steps:
      - name: Checkout exact revision
        run: |
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          url="https://x-access-token:${GITHUB_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3 4 5 6; do
            if git fetch -q --depth=1 "$url" "${GITHUB_SHA}"; then break; fi
            if [ "$attempt" = 6 ]; then echo "Could not fetch repository" >&2; exit 1; fi
            sleep 10
          done
          git checkout -q FETCH_HEAD
      - name: Build release binary
        run: cargo build --release --bin kalisto
      - name: Smoke run
        run: '"$CARGO_TARGET_DIR/release/kalisto" ls'

  apple-container-live:
    needs: [rust-fmt, rust-clippy, rust-test]
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/feat/apple-container-k3s') }}
    runs-on: ${{ vars.KALISTO_MACOS_RUNNER }}
    timeout-minutes: 60
    env:
      KALISTO_MACOS_VOLUME: ${{ vars.KALISTO_MACOS_VOLUME }}
      KALISTO_MACOS_BUILD_ROOT: ${{ vars.KALISTO_MACOS_BUILD_ROOT }}
      KALISTO_LIVE_APPLE_CONTAINER_BOOT_BUDGET: "1"
    steps:
      - name: Verify external storage and checkout into owned workspace
        run: |
          set -eu
          storage=$(python3 - <<'PY'
          import os
          from pathlib import Path
          assert Path(os.environ["KALISTO_MACOS_VOLUME"]).is_absolute(), "external volume must be an absolute path"
          assert Path(os.environ["KALISTO_MACOS_BUILD_ROOT"]).is_absolute(), "build root must be an absolute path"
          volume = Path(os.environ["KALISTO_MACOS_VOLUME"]).resolve(strict=True)
          root = Path(os.environ["KALISTO_MACOS_BUILD_ROOT"]).resolve()
          assert volume != Path("/") and os.path.ismount(volume), "external build volume must be mounted"
          assert root != volume and root.is_relative_to(volume), "build root must be beneath the external volume"
          root.mkdir(parents=True, exist_ok=True)
          assert root.stat().st_dev == volume.stat().st_dev, "build root must remain on the external volume"
          print(root)
          PY
          )
          workspace=$(mktemp -d "$storage/kalisto-native.XXXXXX")
          printf 'KALISTO_APPLE_WORKSPACE=%s\n' "$workspace" >> "$GITHUB_ENV"
          mkdir -p "$workspace/tmp" "$workspace/data/kalisto" "$storage/cargo-home" \
            "$storage/release-rustup" "$storage/sccache" \
            "$storage/apple-container-ci/target" "$storage/apple-container-ci/artifacts"
          ln -s "$storage/apple-container-ci/artifacts" "$workspace/data/kalisto/artifacts"
          export TMPDIR="$workspace/tmp"
          export CARGO_TARGET_DIR="$storage/apple-container-ci/target"
          printf 'CARGO_HOME=%s/cargo-home\nRUSTUP_HOME=%s/release-rustup\nSCCACHE_DIR=%s/sccache\n' "$storage" "$storage" "$storage" >> "$GITHUB_ENV"
          printf 'CARGO_TARGET_DIR=%s\nTMPDIR=%s/tmp\nXDG_DATA_HOME=%s/data\nXDG_CONFIG_HOME=%s/config\nXDG_CACHE_HOME=%s/cache\n' "$CARGO_TARGET_DIR" "$workspace" "$workspace" "$workspace" "$workspace" >> "$GITHUB_ENV"
          cd "$workspace"
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          url="https://x-access-token:${GITHUB_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 "$url" "$GITHUB_SHA"
          git checkout -q --detach "${GITHUB_SHA}^{commit}"
          ln -s "$CARGO_TARGET_DIR" "$workspace/target"
      - name: Prove running Homebrew reuse and fresh functional three-node Cilium within sixty seconds
        run: |
          set -eu
          # Reuse a running Homebrew service. A stopped installed runtime may be started,
          # but never replace a running daemon or change its roots/configuration.
          export PATH="/opt/homebrew/bin:$PATH"
          status_code=0
          status=$(container system status --format json) || status_code=$?
          state=$(printf '%s' "$status" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')
          case "$state:$status_code" in
            running:0) ;;
            unregistered:1) container system start --disable-kernel-install ;;
            *) printf 'Unsupported container service status (%s): %s\n' "$status_code" "$status" >&2; exit 1 ;;
          esac
          cd "$KALISTO_APPLE_WORKSPACE"
          cargo test --locked --release --lib runtime::tests -- --nocapture
          python3 scripts/ci/progress_manifest.py "$KALISTO_APPLE_WORKSPACE/progress-check"
          cargo test --manifest-path "$KALISTO_APPLE_WORKSPACE/progress-check/Cargo.toml" \
            --test terminal-progress -- --nocapture --test-threads=1
          cargo test --locked --release --lib \
            apple_container::image::tests::loopback_import_serves_exact_manifest_and_layer_without_extracting -- --nocapture
          cargo test --locked --release --test macos_three_node_boot_budget \
            apple_container_k3s_has_functional_three_node_cilium_under_one_minute -- --nocapture
      - name: Upload benchmark measurements
        if: always()
        uses: https://data.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: apple-container-boot-budget
          path: |
            ${{ env.CARGO_TARGET_DIR }}/kalisto/boot-budget/*/result.json
            ${{ env.CARGO_TARGET_DIR }}/kalisto/boot-budget/*/*-image-timings.log
            ${{ env.CARGO_TARGET_DIR }}/kalisto/boot-budget/*/backend-isolation.json
            ${{ env.CARGO_TARGET_DIR }}/kalisto/boot-budget/*/runtime-*.json
          if-no-files-found: warn
          retention-days: 7
      - name: Clean only this job's clusters and ephemeral data
        if: always()
        run: |
          set -eu
          if [ -z "${KALISTO_APPLE_WORKSPACE:-}" ] || [ -z "${XDG_DATA_HOME:-}" ]; then exit 0; fi
          storage=$(cd "$KALISTO_MACOS_BUILD_ROOT" && pwd -P)
          case "$KALISTO_APPLE_WORKSPACE" in "$storage"/kalisto-native.*) ;; *) exit 1 ;; esac
          case "$XDG_DATA_HOME" in "$KALISTO_APPLE_WORKSPACE"/data) ;; *) exit 1 ;; esac
          if [ -x "$CARGO_TARGET_DIR/release/kalisto" ]; then
            "$CARGO_TARGET_DIR/release/kalisto" destroy --all
          fi
          # Lifecycle ownership checks remove only task-owned nodes/networks.
          # Never stop the shared daemon or remove its persistent application root.
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          data = Path(os.environ["XDG_DATA_HOME"]).resolve()
          runtime = data / "kalisto/apple-container"
          selection = runtime / "selection.json"
          if selection.exists():
              selected = json.loads(selection.read_text())
              assert selected["managed"] is False, "unexpected managed service; retaining isolated data"
              app = Path(selected["app_root"]).resolve()
              assert app != data and data not in app.parents, "service data is not ephemeral; retaining isolated data"
          else:
              assert not runtime.exists(), "runtime ownership is unknown; retaining isolated data"
          PY
          rm -rf -- "$KALISTO_APPLE_WORKSPACE"
