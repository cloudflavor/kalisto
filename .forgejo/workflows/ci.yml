name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      firecracker_live:
        description: Run native Firecracker acceptance using prepared host artifacts
        required: false
        default: false
        type: boolean

concurrency:
  group: kalisto-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'workflow_dispatch' }}

jobs:
  rust-fmt:
    runs-on: ${{ vars.KALISTO_LINUX_RUNNER }}
    timeout-minutes: 60
    container:
      image: ${{ vars.KALISTO_CI_IMAGE }}
      options: ${{ vars.KALISTO_CI_CONTAINER_OPTIONS }}
    env:
      CARGO_TARGET_DIR: /tmp/kalisto-target-fmt
    steps:
      - name: Checkout exact revision
        run: |
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          # Keep the job token out of the persisted remote URL.
          url="https://x-access-token:${GITHUB_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3 4 5 6; do
            if git fetch -q --depth=1 "$url" "${GITHUB_SHA}"; then break; fi
            if [ "$attempt" = 6 ]; then echo "Could not fetch repository" >&2; exit 1; fi
            sleep 10
          done
          git checkout -q FETCH_HEAD
      - name: Toolchain versions
        run: |
          rustc --version
          cargo --version
      - name: Format
        run: cargo fmt --all --check
      - name: Check terminal harness formatting
        run: |
          python3 scripts/ci/progress_manifest.py /tmp/kalisto-progress-fmt
          cargo fmt --manifest-path /tmp/kalisto-progress-fmt/Cargo.toml --all --check

  rust-clippy:
    runs-on: ${{ vars.KALISTO_LINUX_RUNNER }}
    timeout-minutes: 60
    container:
      image: ${{ vars.KALISTO_CI_IMAGE }}
      options: ${{ vars.KALISTO_CI_CONTAINER_OPTIONS }}
    env:
      CARGO_TARGET_DIR: /tmp/kalisto-target-clippy
    steps:
      - name: Checkout exact revision
        run: |
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          url="https://x-access-token:${GITHUB_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3 4 5 6; do
            if git fetch -q --depth=1 "$url" "${GITHUB_SHA}"; then break; fi
            if [ "$attempt" = 6 ]; then echo "Could not fetch repository" >&2; exit 1; fi
            sleep 10
          done
          git checkout -q FETCH_HEAD
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Compile cache stats
        if: always()
        run: sccache --show-stats
      - name: Upload resolved dependency lock
        if: always()
        uses: https://data.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: resolved-dependencies
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 7

  rust-test:
    runs-on: ${{ vars.KALISTO_LINUX_RUNNER }}
    timeout-minutes: 60
    container:
      image: ${{ vars.KALISTO_CI_IMAGE }}
      options: ${{ vars.KALISTO_CI_CONTAINER_OPTIONS }}
    env:
      CARGO_TARGET_DIR: /tmp/kalisto-target-test
    steps:
      - name: Checkout exact revision
        run: |
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          url="https://x-access-token:${GITHUB_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3 4 5 6; do
            if git fetch -q --depth=1 "$url" "${GITHUB_SHA}"; then break; fi
            if [ "$attempt" = 6 ]; then echo "Could not fetch repository" >&2; exit 1; fi
            sleep 10
          done
          git checkout -q FETCH_HEAD
      - name: Test website release staging
        run: python3 -m unittest discover -s scripts/release -p 'test_stage.py' -v
      - name: Test worker removal and interrupted lifecycle recovery
        run: cargo test --locked --lib cluster::manager::tests::worker_scale_down -- --test-threads=1
      - name: Test
        run: cargo test -- --test-threads=1
      - name: Test native terminal progress and plain output
        run: |
          python3 scripts/ci/progress_manifest.py /tmp/kalisto-progress-test
          cargo test --manifest-path /tmp/kalisto-progress-test/Cargo.toml \
            --test terminal-progress -- --nocapture --test-threads=1

  build-bin:
    runs-on: ${{ vars.KALISTO_LINUX_RUNNER }}
    timeout-minutes: 60
    container:
      image: ${{ vars.KALISTO_CI_IMAGE }}
      options: ${{ vars.KALISTO_CI_CONTAINER_OPTIONS }}
    env:
      CARGO_TARGET_DIR: /tmp/kalisto-target-build
    needs: [rust-fmt, rust-clippy, rust-test]
    steps:
      - name: Checkout exact revision
        run: |
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          url="https://x-access-token:${GITHUB_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3 4 5 6; do
            if git fetch -q --depth=1 "$url" "${GITHUB_SHA}"; then break; fi
            if [ "$attempt" = 6 ]; then echo "Could not fetch repository" >&2; exit 1; fi
            sleep 10
          done
          git checkout -q FETCH_HEAD
      - name: Build release binary
        run: cargo build --release --bin kalisto
      - name: Smoke run
        run: '"$CARGO_TARGET_DIR/release/kalisto" ls'

  firecracker-live:
    needs: [rust-fmt, rust-clippy, rust-test]
    # No fork code on the shared KVM host. Main gating is enabled only once a
    # compatible prepared kernel is configured; manual dispatch can discover it.
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.firecracker_live == true) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.KALISTO_FIRECRACKER_KERNEL != '') }}
    runs-on: tomis-host
    timeout-minutes: 60
    env:
      KALISTO_LINUX_BUILD_ROOT: ${{ vars.KALISTO_LINUX_BUILD_ROOT }}
      KALISTO_LINUX_CA_BUNDLE: ${{ vars.KALISTO_LINUX_CA_BUNDLE }}
      KALISTO_FIRECRACKER_KERNEL: ${{ vars.KALISTO_FIRECRACKER_KERNEL }}
      KALISTO_FIRECRACKER_ROOTFS: ${{ vars.KALISTO_FIRECRACKER_ROOTFS }}
      KALISTO_LIVE_FIRECRACKER_TESTS: "1"
    steps:
      - name: Reuse native tools and verified prepared artifacts without provisioning
        run: |
          set -eu
          export PATH="$HOME/.local/bin:$PATH"
          python3 - <<'PY'
          import hashlib
          import os
          import platform
          import shutil
          import stat
          import subprocess
          from pathlib import Path
          assert platform.system() == "Linux" and platform.machine() == "x86_64"
          assert os.access("/dev/kvm", os.R_OK | os.W_OK), "KVM must be accessible"
          subprocess.run(["unshare", "--user", "--map-root-user", "--net", "true"], check=True)
          for tool in ("firecracker", "debugfs", "mke2fs", "ssh", "ssh-keygen", "scp",
                       "ip", "iptables", "sysctl", "slirp4netns", "unshare", "nsenter", "curl"):
              assert shutil.which(tool), f"Required existing native tool missing: {tool}"
          version = subprocess.check_output(["firecracker", "--version"], text=True)
          assert version.splitlines()[0] == "Firecracker v1.18.0", "Use validated Firecracker v1.18.0"
          root = Path(os.environ.get("KALISTO_LINUX_BUILD_ROOT") or Path.home() / ".cache/kalisto-firecracker-ci")
          assert root.is_absolute() and not root.is_symlink()
          root = root.resolve()
          assert root not in (Path("/"), Path.home().resolve())
          assert "\n" not in str(root) and "\r" not in str(root)
          root.mkdir(parents=True, exist_ok=True, mode=0o700)
          assert root.stat().st_uid == os.getuid() and not stat.S_IMODE(root.stat().st_mode) & 0o077
          cache = Path.home() / ".local/share/kalisto/artifacts/firecracker-node"
          images = {}
          for key, filename in (
              ("KALISTO_FIRECRACKER_KERNEL", "kalisto-vmlinux"),
              ("KALISTO_FIRECRACKER_ROOTFS", "ubuntu-24.04-minimal-k3s-amd64-rootfs.raw"),
          ):
              configured = os.environ.get(key)
              candidates = [Path(configured)] if configured else [
                  cache / track / "x86_64" / filename for track in ("v1.18", "v1.13")
              ]
              image = next((path for path in candidates if path.is_file()), None)
              assert image is not None and image.is_absolute(), f"Configure {key} with a prepared absolute image path"
              image = image.resolve(strict=True)
              assert image.stat().st_size > 0 and os.access(image, os.R_OK)
              assert "\n" not in str(image) and "\r" not in str(image)
              images[key] = image
          kernel = images["KALISTO_FIRECRACKER_KERNEL"]
          config = Path(str(kernel) + ".config")
          manifest = dict(line.split("=", 1) for line in Path(str(kernel) + ".manifest").read_text().splitlines())
          assert "CONFIG_NETFILTER_XT_MATCH_STATISTIC=y" in config.read_text().splitlines(), "Prepare a kernel supporting multi-endpoint Services"
          def digest(path):
              result = hashlib.sha256()
              with path.open("rb") as stream:
                  for block in iter(lambda: stream.read(1024 * 1024), b""):
                      result.update(block)
              return result.hexdigest()
          assert digest(kernel) == manifest["KERNEL_SHA256"], "Prepared kernel checksum mismatch"
          assert digest(config) == manifest["KERNEL_CONFIG_SHA256"], "Prepared kernel config checksum mismatch"
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"KALISTO_LINUX_BUILD_ROOT={root}\n")
              for key, image in images.items():
                  output.write(f"{key}={image}\n")
          PY
      - name: Check out exact source into an owned native workspace
        run: |
          set -eu
          umask 077
          workspace=$(mktemp -d "$KALISTO_LINUX_BUILD_ROOT/kalisto-native.XXXXXX")
          mkdir -p "$workspace/tmp" "$KALISTO_LINUX_BUILD_ROOT/firecracker-ci/target"
          printf 'KALISTO_FIRECRACKER_WORKSPACE=%s\nCARGO_TARGET_DIR=%s/firecracker-ci/target\nTMPDIR=%s/tmp\n' \
            "$workspace" "$KALISTO_LINUX_BUILD_ROOT" "$workspace" >> "$GITHUB_ENV"
          cd "$workspace"
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          if [ -n "${KALISTO_LINUX_CA_BUNDLE:-}" ]; then export GIT_SSL_CAINFO="$KALISTO_LINUX_CA_BUNDLE"; fi
          url="https://x-access-token:${GITHUB_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git"
          if ! git -c credential.helper= fetch -q --depth=1 "$url" "$GITHUB_SHA" 2>/dev/null; then
            echo 'Unable to fetch exact native test source' >&2
            exit 1
          fi
          unset url
          git checkout -q --detach "${GITHUB_SHA}^{commit}"
      - name: Prove installed CLI cold boot, persistence and worker scaling natively
        run: |
          set -eu
          export PATH="$HOME/.local/bin:$PATH"
          cd "$KALISTO_FIRECRACKER_WORKSPACE"
          cargo test --locked --release --test linux_firecracker_live -- --nocapture
      - name: Remove only the owned checkout
        if: ${{ always() && env.KALISTO_FIRECRACKER_WORKSPACE != '' }}
        run: |
          set -eu
          case "$KALISTO_FIRECRACKER_WORKSPACE" in
            "$KALISTO_LINUX_BUILD_ROOT"/kalisto-native.*) rm -rf -- "$KALISTO_FIRECRACKER_WORKSPACE" ;;
            *) echo 'Refusing cleanup outside owned workspace' >&2; exit 1 ;;
          esac

  apple-container-live:
    needs: [rust-fmt, rust-clippy, rust-test]
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ${{ vars.KALISTO_MACOS_RUNNER }}
    timeout-minutes: 60
    env:
      KALISTO_MACOS_VOLUME: ${{ vars.KALISTO_MACOS_VOLUME }}
      KALISTO_MACOS_BUILD_ROOT: ${{ vars.KALISTO_MACOS_BUILD_ROOT }}
      KALISTO_LIVE_APPLE_CONTAINER_BOOT_BUDGET: "1"
    steps:
      - name: Verify external storage and checkout into owned workspace
        run: |
          set -eu
          storage=$(python3 - <<'PY'
          import os
          from pathlib import Path
          assert Path(os.environ["KALISTO_MACOS_VOLUME"]).is_absolute(), "external volume must be an absolute path"
          assert Path(os.environ["KALISTO_MACOS_BUILD_ROOT"]).is_absolute(), "build root must be an absolute path"
          volume = Path(os.environ["KALISTO_MACOS_VOLUME"]).resolve(strict=True)
          root = Path(os.environ["KALISTO_MACOS_BUILD_ROOT"]).resolve()
          assert volume != Path("/") and os.path.ismount(volume), "external build volume must be mounted"
          assert root != volume and root.is_relative_to(volume), "build root must be beneath the external volume"
          root.mkdir(parents=True, exist_ok=True)
          assert root.stat().st_dev == volume.stat().st_dev, "build root must remain on the external volume"
          print(root)
          PY
          )
          workspace=$(mktemp -d "$storage/kalisto-native.XXXXXX")
          printf 'KALISTO_APPLE_WORKSPACE=%s\n' "$workspace" >> "$GITHUB_ENV"
          mkdir -p "$workspace/tmp" "$workspace/data" "$workspace/state" "$storage/cargo-home" \
            "$storage/release-rustup" "$storage/sccache" \
            "$storage/apple-container-ci/target" "$storage/apple-container-ci/artifacts"
          ln -s "$workspace/state" "$workspace/data/kalisto"
          ln -s "$storage/apple-container-ci/artifacts" "$workspace/data/kalisto/artifacts"
          export TMPDIR="$workspace/tmp"
          export CARGO_TARGET_DIR="$storage/apple-container-ci/target"
          printf 'CARGO_HOME=%s/cargo-home\nRUSTUP_HOME=%s/release-rustup\nSCCACHE_DIR=%s/sccache\n' "$storage" "$storage" "$storage" >> "$GITHUB_ENV"
          printf 'CARGO_TARGET_DIR=%s\nTMPDIR=%s/tmp\nXDG_DATA_HOME=%s/data\nXDG_CONFIG_HOME=%s/config\nXDG_CACHE_HOME=%s/cache\n' "$CARGO_TARGET_DIR" "$workspace" "$workspace" "$workspace" "$workspace" >> "$GITHUB_ENV"
          cd "$workspace"
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          url="https://x-access-token:${GITHUB_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 "$url" "$GITHUB_SHA"
          git checkout -q --detach "${GITHUB_SHA}^{commit}"
          ln -s "$CARGO_TARGET_DIR" "$workspace/target"
      - name: Prove running Homebrew reuse and fresh functional three-node Cilium within sixty seconds
        run: |
          set -eu
          # Reuse a running Homebrew service. A stopped installed runtime may be started,
          # but never replace a running daemon or change its roots/configuration.
          export PATH="/opt/homebrew/bin:$PATH"
          status_code=0
          status=$(container system status --format json) || status_code=$?
          state=$(printf '%s' "$status" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')
          case "$state:$status_code" in
            running:0) ;;
            unregistered:1) container system start --disable-kernel-install ;;
            *) printf 'Unsupported container service status (%s): %s\n' "$status_code" "$status" >&2; exit 1 ;;
          esac
          cd "$KALISTO_APPLE_WORKSPACE"
          cargo test --locked --release --lib runtime::tests -- --nocapture
          cargo test --locked --release --lib backend::apple_container::tests -- --nocapture
          python3 scripts/ci/progress_manifest.py "$KALISTO_APPLE_WORKSPACE/progress-check"
          cargo test --manifest-path "$KALISTO_APPLE_WORKSPACE/progress-check/Cargo.toml" \
            --test terminal-progress -- --nocapture --test-threads=1
          cargo test --locked --release --lib \
            apple_container::image::tests::loopback_import_serves_exact_manifest_and_layer_without_extracting -- --nocapture
          cargo test --locked --release --test macos_three_node_boot_budget \
            apple_container_k3s_has_functional_three_node_cilium_under_one_minute -- --nocapture
      - name: Upload benchmark measurements
        if: always()
        uses: https://data.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: apple-container-boot-budget
          path: |
            ${{ env.CARGO_TARGET_DIR }}/kalisto/boot-budget/*/result.json
            ${{ env.CARGO_TARGET_DIR }}/kalisto/boot-budget/*/*-image-timings.log
            ${{ env.CARGO_TARGET_DIR }}/kalisto/boot-budget/*/backend-isolation.json
            ${{ env.CARGO_TARGET_DIR }}/kalisto/boot-budget/*/runtime-*.json
            ${{ env.CARGO_TARGET_DIR }}/kalisto/boot-budget/*/up.log
            ${{ env.CARGO_TARGET_DIR }}/kalisto/boot-budget/*/pull.log
          if-no-files-found: warn
          retention-days: 7
      - name: Clean only this job's clusters and ephemeral data
        if: always()
        run: |
          set -eu
          if [ -z "${KALISTO_APPLE_WORKSPACE:-}" ] || [ -z "${XDG_DATA_HOME:-}" ]; then exit 0; fi
          storage=$(cd "$KALISTO_MACOS_BUILD_ROOT" && pwd -P)
          case "$KALISTO_APPLE_WORKSPACE" in "$storage"/kalisto-native.*) ;; *) exit 1 ;; esac
          case "$XDG_DATA_HOME" in "$KALISTO_APPLE_WORKSPACE"/data) ;; *) exit 1 ;; esac
          if [ -x "$CARGO_TARGET_DIR/release/kalisto" ]; then
            "$CARGO_TARGET_DIR/release/kalisto" destroy --all
          fi
          # Lifecycle ownership checks remove only task-owned nodes/networks.
          # Never stop the shared daemon or remove its persistent application root.
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          data = Path(os.environ["XDG_DATA_HOME"]).resolve()
          runtime = data / "kalisto/apple-container"
          selection = runtime / "selection.json"
          if selection.exists():
              selected = json.loads(selection.read_text())
              assert selected["managed"] is False, "unexpected managed service; retaining isolated data"
              app = Path(selected["app_root"]).resolve()
              assert app != data and data not in app.parents, "service data is not ephemeral; retaining isolated data"
          else:
              assert not runtime.exists(), "runtime ownership is unknown; retaining isolated data"
          PY
          rm -rf -- "$KALISTO_APPLE_WORKSPACE"
