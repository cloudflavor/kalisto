[package]
name = "kalisto"
version = "0.1.0"
edition = "2024"

[lib]
name = "kalisto"
path = "src/lib.rs"

[[bin]]
name = "kalisto"
path = "src/main.rs"

[dependencies]
structopt = "0.3.26"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread"] }
