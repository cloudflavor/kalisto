stages:
  - validate
  - build

.rust-job:
  image: rust:bookworm
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  cache:
    key: rust-v1
    paths:
      - .cargo/bin/
      - .cargo/registry/
      - .cargo/git/
      - target/
  before_script:
    - export CARGO_TARGET_DIR="$CI_PROJECT_DIR/target/$(printf '%s' "${CI_JOB_NAME:-job}" | tr ': /' '---')-$(uname -m)"
    - |
      for attempt in 1 2 3 4 5; do
        if rustup component add rustfmt clippy; then
          break
        fi
        if [ "${attempt}" -eq 5 ]; then
          echo "rustup component add failed after ${attempt} attempts" >&2
          exit 1
        fi
        sleep 5
      done

fmt:
  stage: validate
  extends: .rust-job
  script:
    - cargo fmt --check

clippy:
  stage: validate
  extends: .rust-job
  script:
    - cargo clippy --all-targets --all-features -- -D warnings

test:
  stage: validate
  extends: .rust-job
  script:
    - cargo test -- --test-threads=1

build:bin:
  stage: build
  extends: .rust-job
  before_script:
    - export CARGO_TARGET_DIR="$CI_PROJECT_DIR/target/$(printf '%s' "${CI_JOB_NAME:-job}" | tr ': /' '---')-$(uname -m)"
  script:
    - cargo build --release --bin kalisto
  artifacts:
    paths:
      - target/*/release/kalisto

.build:lima-node-rootfs:
  stage: build
  image: ubuntu:noble
  cache:
    key: "lima-rootfs-${KALISTO_UBUNTU_ARCH}-v1"
    paths:
      - .cache/buildkit/
      - .cache/k3s/
  before_script:
    - |
      apt_get() {
        if [ "$(id -u)" -eq 0 ]; then
          apt-get "$@"
        elif command -v sudo >/dev/null 2>&1; then
          sudo -n apt-get "$@"
        else
          echo "apt-get requires root privileges or sudo" >&2
          return 1
        fi
      }
      apt_get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
    - |
      apt_get() {
        if [ "$(id -u)" -eq 0 ]; then
          apt-get "$@"
        elif command -v sudo >/dev/null 2>&1; then
          sudo -n apt-get "$@"
        else
          echo "apt-get requires root privileges or sudo" >&2
          return 1
        fi
      }
      apt_get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends ca-certificates curl runc tar
  script:
    - ./scripts/image/run_buildkit_container_build.sh
    - tar -C "${KALISTO_BUILDKIT_OUTPUT_DIR}" -cf "${KALISTO_BUILDKIT_OUTPUT_DIR}/rootfs.tar" rootfs
  artifacts:
    paths:
      - artifacts/lima-rootfs/*/rootfs.tar

.build:lima-node-image:
  stage: build
  image: ubuntu:noble
  cache:
    key: "lima-node-image-${KALISTO_UBUNTU_ARCH}-v1"
    paths:
      - .cache/k3s/
      - .cache/lima-node/work/
  before_script:
    - mkdir -p "${KALISTO_IMAGE_WORK_DIR}" "${KALISTO_IMAGE_SCRATCH_DIR}"
    - chmod -R u+rwX,go+rwX "${CI_PROJECT_DIR}/.cache/k3s" "${CI_PROJECT_DIR}/.cache/lima-node" || true
    - |
      apt_get() {
        if [ "$(id -u)" -eq 0 ]; then
          apt-get "$@"
        elif command -v sudo >/dev/null 2>&1; then
          sudo -n apt-get "$@"
        else
          echo "apt-get requires root privileges or sudo" >&2
          return 1
        fi
      }
      apt_get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
    - |
      apt_get() {
        if [ "$(id -u)" -eq 0 ]; then
          apt-get "$@"
        elif command -v sudo >/dev/null 2>&1; then
          sudo -n apt-get "$@"
        else
          echo "apt-get requires root privileges or sudo" >&2
          return 1
        fi
      }
      apt_get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends ca-certificates curl dosfstools gdisk grub-common ${KALISTO_HOST_GRUB_PACKAGE} mtools parted qemu-utils xz-utils
  script:
    - ./scripts/macos/build_lima_node_image.sh
  artifacts:
    paths:
      - artifacts/lima-node/

build:lima-node-rootfs:arm64:
  extends: .build:lima-node-rootfs
  image:
    name: ubuntu:noble
    docker:
      platform: linux/amd64
      user: root
  variables:
    KALISTO_K3S_CACHE_DIR: "$CI_PROJECT_DIR/.cache/k3s"
    KALISTO_UBUNTU_ARCH: arm64
    KALISTO_BUILDKIT_OUTPUT_DIR: "$CI_PROJECT_DIR/artifacts/lima-rootfs/arm64"

build:lima-node-rootfs:amd64:
  extends: .build:lima-node-rootfs
  image:
    name: ubuntu:noble
    docker:
      platform: linux/amd64
      user: root
  variables:
    KALISTO_K3S_CACHE_DIR: "$CI_PROJECT_DIR/.cache/k3s"
    KALISTO_UBUNTU_ARCH: amd64
    KALISTO_BUILDKIT_OUTPUT_DIR: "$CI_PROJECT_DIR/artifacts/lima-rootfs/amd64"

build:lima-node-image:arm64:
  extends: .build:lima-node-image
  needs:
    - job: build:lima-node-rootfs:arm64
      artifacts: true
  image:
    name: ubuntu:noble
    docker:
      platform: linux/arm64/v8
      user: root
  variables:
    KALISTO_K3S_CACHE_DIR: "$CI_PROJECT_DIR/.cache/k3s"
    KALISTO_IMAGE_WORK_DIR: "$CI_PROJECT_DIR/.cache/lima-node/work"
    KALISTO_IMAGE_SCRATCH_DIR: "/var/tmp/kalisto-lima-node-arm64"
    LIBGUESTFS_BACKEND: direct
    KALISTO_HOST_GRUB_PACKAGE: grub-efi-arm64-bin
    KALISTO_UBUNTU_ARCH: arm64
    KALISTO_IMAGE_BASENAME: ubuntu-24.04-minimal-k3s-arm64
  script:
    - KALISTO_PREBUILT_ROOTFS_ARCHIVE="$CI_PROJECT_DIR/artifacts/lima-rootfs/arm64/rootfs.tar" ./scripts/macos/build_lima_node_image.sh

build:lima-node-image:amd64:
  extends: .build:lima-node-image
  needs:
    - job: build:lima-node-rootfs:amd64
      artifacts: true
  image:
    name: ubuntu:noble
    docker:
      platform: linux/amd64
      user: root
  variables:
    KALISTO_K3S_CACHE_DIR: "$CI_PROJECT_DIR/.cache/k3s"
    KALISTO_IMAGE_WORK_DIR: "$CI_PROJECT_DIR/.cache/lima-node/work"
    KALISTO_IMAGE_SCRATCH_DIR: "/var/tmp/kalisto-lima-node-amd64"
    LIBGUESTFS_BACKEND: direct
    KALISTO_HOST_GRUB_PACKAGE: grub-efi-amd64-bin
    KALISTO_UBUNTU_ARCH: amd64
    KALISTO_IMAGE_BASENAME: ubuntu-24.04-minimal-k3s-amd64
  script:
    - KALISTO_PREBUILT_ROOTFS_ARCHIVE="$CI_PROJECT_DIR/artifacts/lima-rootfs/amd64/rootfs.tar" ./scripts/macos/build_lima_node_image.sh

build:firecracker-kernel:
  stage: build
  image:
    name: debian:bookworm-slim
    docker:
      platform: linux/amd64
      user: root
  variables:
    APT_CACHE_DIR: "$CI_PROJECT_DIR/.cache/apt"
    DEBIAN_FRONTEND: noninteractive
    INITRD: "No"
    KALISTO_FIRECRACKER_VERSION: "v1.13.1"
    KALISTO_FIRECRACKER_ARTIFACT_TRACK: "v1.13"
    KALISTO_FIRECRACKER_ARCH: "x86_64"
    KALISTO_FIRECRACKER_OUTPUT_DIR: "$CI_PROJECT_DIR/artifacts/firecracker-kernel/v1.13/x86_64"
    KALISTO_FIRECRACKER_KERNEL_WORK_DIR: "$CI_PROJECT_DIR/.cache/firecracker-node/work/kernel"
    KALISTO_FIRECRACKER_KERNEL_FILENAME: "kalisto-vmlinux"
    KALISTO_FIRECRACKER_KERNEL_JOBS: "6"
  cache:
    key: firecracker-kernel-v1
    paths:
      - .cache/apt/archives/
      - .cache/apt/lists/
      - .cache/firecracker-node/work/kernel/
  before_script:
    - mkdir -p "${APT_CACHE_DIR}/archives/partial" "${APT_CACHE_DIR}/lists/partial" "${KALISTO_FIRECRACKER_KERNEL_WORK_DIR}"
    - chmod -R u+rwX,go+rwX "${CI_PROJECT_DIR}/.cache/apt" "${CI_PROJECT_DIR}/.cache/firecracker-node" || true
    - |
      apt_get() {
        if [ "$(id -u)" -eq 0 ]; then
          apt-get "$@"
        elif command -v sudo >/dev/null 2>&1; then
          sudo -n apt-get "$@"
        else
          echo "apt-get requires root privileges or sudo" >&2
          return 1
        fi
      }
      apt_get -o dir::cache::archives="${APT_CACHE_DIR}/archives" -o dir::state::lists="${APT_CACHE_DIR}/lists" -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
    - |
      apt_get() {
        if [ "$(id -u)" -eq 0 ]; then
          apt-get "$@"
        elif command -v sudo >/dev/null 2>&1; then
          sudo -n apt-get "$@"
        else
          echo "apt-get requires root privileges or sudo" >&2
          return 1
        fi
      }
      apt_get -o dir::cache::archives="${APT_CACHE_DIR}/archives" -o dir::state::lists="${APT_CACHE_DIR}/lists" -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends bc build-essential ca-certificates curl file flex bison libelf-dev libssl-dev rsync xz-utils
  script:
    - ./scripts/linux/build_firecracker_kernel.sh
  artifacts:
    paths:
      - artifacts/firecracker-kernel/

build:firecracker-rootfs:
  stage: build
  image:
    name: debian:bookworm-slim
    docker:
      platform: linux/amd64
      user: root
  variables:
    APT_CACHE_DIR: "$CI_PROJECT_DIR/.cache/apt"
    DEBIAN_FRONTEND: noninteractive
    INITRD: "No"
    KALISTO_FIRECRACKER_VERSION: "v1.13.1"
    KALISTO_FIRECRACKER_ARTIFACT_TRACK: "v1.13"
    KALISTO_FIRECRACKER_ARCH: "x86_64"
    KALISTO_FIRECRACKER_OUTPUT_DIR: "$CI_PROJECT_DIR/artifacts/firecracker-rootfs/v1.13/x86_64"
    KALISTO_K3S_CACHE_DIR: "$CI_PROJECT_DIR/.cache/k3s"
    KALISTO_FIRECRACKER_WORK_DIR: "$CI_PROJECT_DIR/.cache/firecracker-node/work"
    LIBGUESTFS_BACKEND: direct
  cache:
    key: firecracker-rootfs-v1
    paths:
      - .cache/apt/archives/
      - .cache/apt/lists/
      - .cache/k3s/
      - .cache/firecracker-node/work/
  before_script:
    - mkdir -p "${APT_CACHE_DIR}/archives/partial" "${APT_CACHE_DIR}/lists/partial" "${KALISTO_FIRECRACKER_WORK_DIR}"
    - mkdir -p /boot/grub
    - chmod -R u+rwX,go+rwX "${CI_PROJECT_DIR}/.cache/apt" "${CI_PROJECT_DIR}/.cache/k3s" "${CI_PROJECT_DIR}/.cache/firecracker-node" || true
    - |
      apt_get() {
        if [ "$(id -u)" -eq 0 ]; then
          apt-get "$@"
        elif command -v sudo >/dev/null 2>&1; then
          sudo -n apt-get "$@"
        else
          echo "apt-get requires root privileges or sudo" >&2
          return 1
        fi
      }
      apt_get -o dir::cache::archives="${APT_CACHE_DIR}/archives" -o dir::state::lists="${APT_CACHE_DIR}/lists" -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
    - |
      apt_get() {
        if [ "$(id -u)" -eq 0 ]; then
          apt-get "$@"
        elif command -v sudo >/dev/null 2>&1; then
          sudo -n apt-get "$@"
        else
          echo "apt-get requires root privileges or sudo" >&2
          return 1
        fi
      }
      apt_get -o dir::cache::archives="${APT_CACHE_DIR}/archives" -o dir::state::lists="${APT_CACHE_DIR}/lists" -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends ca-certificates curl libguestfs-tools qemu-utils xz-utils "linux-image-$(dpkg --print-architecture)"
  script:
    - ./scripts/linux/build_firecracker_rootfs.sh
  artifacts:
    paths:
      - artifacts/firecracker-rootfs/

publish:firecracker-artifacts:
  stage: build
  image:
    name: debian:bookworm-slim
    docker:
      platform: linux/amd64
      user: root
  variables:
    KALISTO_IMAGE_BASENAME: "ubuntu-24.04-minimal-k3s-amd64"
    KALISTO_FIRECRACKER_VERSION: "v1.13.1"
    KALISTO_FIRECRACKER_ARTIFACT_TRACK: "v1.13"
    KALISTO_FIRECRACKER_ARCH: "x86_64"
    KALISTO_FIRECRACKER_KERNEL_FILENAME: "kalisto-vmlinux"
  needs:
    - job: build:firecracker-kernel
      artifacts: true
    - job: build:firecracker-rootfs
      artifacts: true
  script:
    - mkdir -p "artifacts/firecracker-node/${KALISTO_FIRECRACKER_ARTIFACT_TRACK}/${KALISTO_FIRECRACKER_ARCH}"
    - cp "artifacts/firecracker-kernel/${KALISTO_FIRECRACKER_ARTIFACT_TRACK}/${KALISTO_FIRECRACKER_ARCH}/"* "artifacts/firecracker-node/${KALISTO_FIRECRACKER_ARTIFACT_TRACK}/${KALISTO_FIRECRACKER_ARCH}/"
    - cp "artifacts/firecracker-rootfs/${KALISTO_FIRECRACKER_ARTIFACT_TRACK}/${KALISTO_FIRECRACKER_ARCH}/${KALISTO_IMAGE_BASENAME}-rootfs.raw" "artifacts/firecracker-node/${KALISTO_FIRECRACKER_ARTIFACT_TRACK}/${KALISTO_FIRECRACKER_ARCH}/${KALISTO_IMAGE_BASENAME}-rootfs.raw"
    - if [ -f "artifacts/firecracker-rootfs/${KALISTO_FIRECRACKER_ARTIFACT_TRACK}/${KALISTO_FIRECRACKER_ARCH}/${KALISTO_IMAGE_BASENAME}-rootfs.raw.xz" ]; then cp "artifacts/firecracker-rootfs/${KALISTO_FIRECRACKER_ARTIFACT_TRACK}/${KALISTO_FIRECRACKER_ARCH}/${KALISTO_IMAGE_BASENAME}-rootfs.raw.xz" "artifacts/firecracker-node/${KALISTO_FIRECRACKER_ARTIFACT_TRACK}/${KALISTO_FIRECRACKER_ARCH}/${KALISTO_IMAGE_BASENAME}-rootfs.raw.xz"; fi
    - cp "artifacts/firecracker-rootfs/${KALISTO_FIRECRACKER_ARTIFACT_TRACK}/${KALISTO_FIRECRACKER_ARCH}/${KALISTO_IMAGE_BASENAME}-rootfs.manifest" "artifacts/firecracker-node/${KALISTO_FIRECRACKER_ARTIFACT_TRACK}/${KALISTO_FIRECRACKER_ARCH}/${KALISTO_IMAGE_BASENAME}-rootfs.manifest"
    - |
      KALISTO_FIRECRACKER_OUTPUT_DIR="${CI_PROJECT_DIR}/artifacts/firecracker-node/${KALISTO_FIRECRACKER_ARTIFACT_TRACK}/${KALISTO_FIRECRACKER_ARCH}" \
      KALISTO_FIRECRACKER_ROOTFS_MANIFEST_PATH="${CI_PROJECT_DIR}/artifacts/firecracker-node/${KALISTO_FIRECRACKER_ARTIFACT_TRACK}/${KALISTO_FIRECRACKER_ARCH}/${KALISTO_IMAGE_BASENAME}-rootfs.manifest" \
      KALISTO_FIRECRACKER_ARTIFACT_MANIFEST_PATH="${CI_PROJECT_DIR}/artifacts/firecracker-node/${KALISTO_FIRECRACKER_ARTIFACT_TRACK}/${KALISTO_FIRECRACKER_ARCH}/firecracker-artifacts.manifest" \
      KALISTO_FIRECRACKER_ARTIFACT_BASE_URL="${CI_PROJECT_URL:+${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/raw/artifacts/firecracker-node/${KALISTO_FIRECRACKER_ARTIFACT_TRACK}/${KALISTO_FIRECRACKER_ARCH}}" \
      ./scripts/linux/render_firecracker_artifact_manifest.sh
  artifacts:
    paths:
      - artifacts/firecracker-node/
