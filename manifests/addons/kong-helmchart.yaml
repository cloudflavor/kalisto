apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: kong
  namespace: kube-system
spec:
  repo: https://charts.konghq.com
  chart: kong
  targetNamespace: kube-system
  valuesContent: |-
    ingressController:
      enabled: true
      ingressClass: kong
      createIngressClass: true
      env:
        publish_service: kube-system/kong-kong-proxy
    proxy:
      type: LoadBalancer
